name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install numpy==2.5.4 scipy==1.18.1 ruff==0.17.4
      - run: make lint
      # The benchmark data has no stated license, so CI never downloads it; the data tests skip without it.
      - run: make test
